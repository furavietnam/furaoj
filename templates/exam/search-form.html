<div class="sidebox exam-search-box">
    <h3>
        <span>{{ _('Exam search') }}</span>
        <i class="fa fa-search"></i>
    </h3>
    <div class="sidebox-content">
        <form id="filter-form" name="form" action="" method="get">
            <div class="filter-search-input-wrap">
                <i class="fa fa-search search-field-icon"></i>
                <input id="search" type="text" name="q" value="{{ search_query or '' }}"
                       placeholder="{{ _('Search exams...') }}">
            </div>

            <div class="filter-form-group">
                <label for="exam_category">
                    <i class="fa fa-folder-open-o"></i> {{ _('Category') }}
                </label>
                <select id="exam_category" name="exam_category">
                    <option value="">{{ _('All categories') }}</option>
                    {% for cat in categories %}
                        <option value="{{ cat.id }}"{% if selected_category and cat.id|string == selected_category|string %} selected{% endif %}>
                            {{ cat.full_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="filter-form-group">
                <label for="province">
                    <i class="fa fa-map-marker"></i> {{ _('Province') }}
                </label>
                <select id="province" name="province">
                    <option value="">{{ _('All provinces') }}</option>
                    {% for prov in provinces %}
                        <option value="{{ prov.id }}"{% if selected_province and prov.id|string == selected_province|string %} selected{% endif %}>
                            {{ prov.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="filter-form-group">
                <label for="year">
                    <i class="fa fa-calendar"></i> {{ _('Year') }}
                </label>
                <select id="year" name="year">
                    <option value="">{{ _('All years') }}</option>
                    {% for y in years %}
                        <option value="{{ y }}"{% if selected_year and y|string == selected_year|string %} selected{% endif %}>
                            {{ y }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-submit-group">
                <button type="submit" id="go" class="exam-submit-btn">
                    <i class="fa fa-filter"></i> {{ _('Filter exams') }}
                </button>
                {% if search_query or selected_category or selected_province or selected_year %}
                    <a href="{{ url('exam_list') }}" class="exam-reset-btn" title="{{ _('Clear filters') }}">
                        <i class="fa fa-times"></i> {{ _('Clear') }}
                    </a>
                {% endif %}
            </div>
        </form>

        <script>
            $(function () {
                var $form = $('form#filter-form');
                var $search = $('#search');

                function clean_submit() {
                    $search.prop('disabled', !$search.val());
                    $form.submit();
                }

                $('#exam_category, #province, #year').select2({
                    theme: '{{ DMOJ_SELECT2_THEME }}'
                });

                $search.keypress(function (e) {
                    if (e.keyCode == 13) {
                        e.preventDefault();
                        clean_submit();
                    }
                });

                $('#go').click(function(e) {
                    e.preventDefault();
                    clean_submit();
                });
            });
        </script>
    </div>
</div>
