<script type="text/javascript">
(function($) {
    'use strict';

    var problemCode = '{{ problem.code }}';
    var liveRunUrl = '{{ url("problem_live_run", problem.code) }}';
    var draftUrl = '{{ url("problem_draft", problem.code) }}';

    window.submission_stats = {{ submission_stats_json|default('{"categories": [], "total": 0}') }};
    window.submission_colors = {{ submission_colors_json|default('{}') }};
    window.initial_draft = {{ draft_json|default('null') }};

    var initialTestcases = [
        { id: 1, input: '', expected: '', actual: '', status: '', time: 0, memory: 0 }
    ];
    if (window.initial_draft && Array.isArray(window.initial_draft.testcases) && window.initial_draft.testcases.length > 0) {
        initialTestcases = window.initial_draft.testcases.map(function(tc, idx) {
            return {
                id: tc.id || (idx + 1),
                input: tc.input || '',
                expected: tc.expected || '',
                actual: '',
                status: '',
                time: 0,
                memory: 0
            };
        });
    }

    var state = {
        activeTab: 0,
        testcases: initialTestcases,
        isDrawerCollapsed: false,
        isSidebarCollapsed: false,
        saveTimeout: null,
        isRunning: false
    };

    function getCsrfToken() {
        var token = $('input[name="csrfmiddlewaretoken"]').val();
        if (!token) {
            var match = document.cookie.match(/csrftoken=([^;]+)/);
            if (match) token = match[1];
        }
        return token;
    }

    function getAceEditor() {
        if (window.ace_source && typeof window.ace_source.getSession === 'function') {
            return window.ace_source;
        }
        return null;
    }

    function resizeAceEditor() {
        var editor = getAceEditor();
        if (editor && typeof editor.resize === 'function') {
            try {
                if (typeof editor.setAutoScrollEditorIntoView === 'function') {
                    editor.setAutoScrollEditorIntoView(false);
                }
                if (typeof editor.setOption === 'function') {
                    editor.setOption('maxLines', null);
                    editor.setOption('minLines', null);
                }
            } catch (e) {}
            editor.resize(true);
        }
    }

    /* ========================================================
       Theme Detection & Synchronization (Dark / Light / Auto)
       ======================================================== */
    function isDarkTheme() {
        var theme = $('body').attr('data-theme') || '';
        if (theme === 'dark') return true;
        if (theme === 'light') return false;
        if (window.matchMedia) {
            return window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        return false;
    }

    function applyTheme() {
        var dark = isDarkTheme();
        var editor = getAceEditor();
        if (editor && typeof editor.setTheme === 'function') {
            var targetTheme = dark ? 'ace/theme/tomorrow_night' : 'ace/theme/textmate';
            try {
                if (editor.getTheme() !== targetTheme) {
                    editor.setTheme(targetTheme);
                }
            } catch (e) {
                editor.setTheme(targetTheme);
            }
        }
        if (window.liveDonutChart) {
            updateChartTheme(window.liveDonutChart, dark);
        }
        var iframe = document.getElementById('live-submissions-iframe');
        if (iframe && iframe.contentDocument && iframe.contentDocument.body) {
            var theme = $('body').attr('data-theme') || '';
            if (theme) {
                $(iframe.contentDocument.body).attr('data-theme', theme);
            }
        }
    }

    function initThemeWatchers() {
        if (window.matchMedia) {
            try {
                var mq = window.matchMedia('(prefers-color-scheme: dark)');
                var mqHandler = function() {
                    applyTheme();
                };
                if (mq.addEventListener) {
                    mq.addEventListener('change', mqHandler);
                } else if (mq.addListener) {
                    mq.addListener(mqHandler);
                }
            } catch (e) {}
        }

        if (window.MutationObserver) {
            var observer = new MutationObserver(function(mutations) {
                for (var i = 0; i < mutations.length; i++) {
                    if (mutations[i].attributeName === 'data-theme') {
                        applyTheme();
                        break;
                    }
                }
            });
            observer.observe(document.body, { attributes: true, attributeFilter: ['data-theme'] });
        }

        // Apply immediately upon initializing watchers
        applyTheme();
    }

    /* ========================================================
       Sidebar Collapse / Expand
       ======================================================== */
    function initSidebar() {
        var $sidebar = $('#live-sidebar-left');
        var $toggleBtn = $('#btn-toggle-sidebar');
        if (!$sidebar.length) return;

        var savedCollapsed = localStorage.getItem('live_ide_sidebar_collapsed');
        var shouldCollapse = savedCollapsed === '1' || (savedCollapsed === null && window.innerWidth <= 1024);

        if (shouldCollapse) {
            $sidebar.addClass('collapsed');
            state.isSidebarCollapsed = true;
            $toggleBtn.find('i').removeClass('fa-angle-double-left').addClass('fa-angle-double-right');
            $toggleBtn.attr('title', '{{ _("Expand sidebar") }}');
        }

        $toggleBtn.on('click', function() {
            state.isSidebarCollapsed = !state.isSidebarCollapsed;
            $sidebar.toggleClass('collapsed', state.isSidebarCollapsed);
            var $icon = $toggleBtn.find('i');
            if (state.isSidebarCollapsed) {
                $icon.removeClass('fa-angle-double-left').addClass('fa-angle-double-right');
                $toggleBtn.attr('title', '{{ _("Expand sidebar") }}');
                localStorage.setItem('live_ide_sidebar_collapsed', '1');
            } else {
                $icon.removeClass('fa-angle-double-right').addClass('fa-angle-double-left');
                $toggleBtn.attr('title', '{{ _("Collapse sidebar") }}');
                localStorage.setItem('live_ide_sidebar_collapsed', '0');
            }
            setTimeout(function() {
                resizeAceEditor();
                if (window.liveDonutChart) {
                    window.liveDonutChart.resize();
                }
            }, 210);
        });
    }

    /* ========================================================
       Submissions Navigation (Direct New-Tab Opening)
       ======================================================== */
    function initSubmissionsModal() {
        window.openSubmissionsModal = function(url) {
            if (url) {
                window.open(url, '_blank');
            }
        };

        $(document).on('click', '.btn-open-sub-modal', function(e) {
            e.preventDefault();
            var url = $(this).data('url') || $(this).attr('href');
            if (url) {
                window.open(url, '_blank');
            }
        });
    }

    /* ========================================================
       Comments Popup Modal
       ======================================================== */
    function initCommentsModal() {
        window.openCommentsModal = function() {
            var $modal = $('#live-comments-modal');
            $modal.fadeIn(150).addClass('active');
            $('body').addClass('live-modal-open');
            var loader = $('#comments').data('load-comments');
            if (typeof loader === 'function') {
                loader();
            }
        };

        window.closeCommentsModal = function() {
            var $modal = $('#live-comments-modal');
            $modal.fadeOut(150).removeClass('active');
            $('body').removeClass('live-modal-open');
        };

        $(document).on('click', '#btn-open-comments-modal', function(e) {
            e.preventDefault();
            window.openCommentsModal();
        });

        $(document).on('click', '#btn-close-comments-modal, #live-comments-modal-overlay', function(e) {
            e.preventDefault();
            window.closeCommentsModal();
        });

        $(document).on('keydown', function(e) {
            if (e.key === 'Escape' && $('#live-comments-modal').hasClass('active')) {
                window.closeCommentsModal();
            }
        });

        // Auto-open if URL has #comments or #comment-<id>, or if there are comment form errors
        var hash = window.location.hash;
        if (hash === '#comments' || /^#comment-\d+$/.test(hash) || $('#comments').data('comments-preloaded')) {
            setTimeout(window.openCommentsModal, 200);
        }

        // Handle AJAX comment submission inside modal
        $(document).on('submit', '#comments form.comment-submit-form', function(e) {
            e.preventDefault();
            var $form = $(this);
            var $btn = $form.find('button[type="submit"], input[type="submit"]');
            var originalBtnHtml = $btn.html() || $btn.val();
            $btn.prop('disabled', true);
            if ($btn.is('button')) {
                $btn.html('<i class="fa fa-spinner fa-spin"></i> {{ _("Posting...") }}');
            }

            saveDraftImmediate();

            $.ajax({
                url: window.location.pathname,
                method: 'POST',
                data: $form.serialize(),
                headers: {
                    'X-CSRFToken': getCsrfToken()
                },
                success: function(data) {
                    var $resp = $(data);
                    var $newComments = $resp.find('#comments');
                    if ($newComments.length && $newComments.find('#form-errors').length) {
                        $('#comments').html($newComments.html());
                    } else {
                        var fetchUrl = $('#comments').data('comments-url');
                        if (fetchUrl) {
                            $('#comments').html('<div class="comments-loading">{{ _("Loading...") }}</div>');
                            $('#comments').load(fetchUrl, function() {
                                if (window.MathJax && MathJax.typesetPromise) {
                                    MathJax.typesetPromise([$('#comments')[0]]);
                                }
                            });
                        }
                    }
                },
                error: function() {
                    $btn.prop('disabled', false);
                    if ($btn.is('button')) {
                        $btn.html(originalBtnHtml);
                    }
                    alert('{{ _("Error posting comment.") }}');
                }
            });
        });
    }

    /* ========================================================
       Interactive Submission Stats Donut Chart
       ======================================================== */
    function getVerdictColors() {
        var defaultColors = {
            'AC': '#16a34a',
            'PAC': '#84cc16',
            'WA': '#dc2626',
            'CE': '#d97706',
            'TLE': '#ea580c',
            'MLE': '#7c3aed',
            'RTE': '#991b1b',
            'ERR': '#e11d48'
        };
        return $.extend({}, defaultColors, window.submission_colors || {});
    }

    function updateChartTheme(chart, isDark) {
        if (!chart) return;
        var borderColor = isDark ? '#1e293b' : '#ffffff';
        if (chart.data && chart.data.datasets && chart.data.datasets[0]) {
            chart.data.datasets[0].borderColor = borderColor;
            var stats = window.submission_stats || { categories: [], total: 0 };
            if (!stats.total) {
                chart.data.datasets[0].backgroundColor = [isDark ? '#334155' : '#e2e8f0'];
            }
        }
        if (chart.options && chart.options.tooltips) {
            chart.options.tooltips.backgroundColor = isDark ? 'rgba(15, 23, 42, 0.96)' : 'rgba(255, 255, 255, 0.96)';
            chart.options.tooltips.titleFontColor = isDark ? '#f8fafc' : '#0f172a';
            chart.options.tooltips.bodyFontColor = isDark ? '#cbd5e1' : '#334155';
            chart.options.tooltips.borderColor = isDark ? '#334155' : '#cbd5e1';
        }
        chart.update();
    }

    function initDonutChart() {
        var canvas = document.getElementById('live-submission-donut');
        if (!canvas) return;

        if (typeof Chart === 'undefined') {
            var attempts = 0;
            var timer = setInterval(function() {
                attempts++;
                if (typeof Chart !== 'undefined') {
                    clearInterval(timer);
                    initDonutChart();
                } else if (attempts > 30) {
                    clearInterval(timer);
                }
            }, 100);
            return;
        }

        var stats = window.submission_stats || { categories: [], total: 0 };
        var total = stats.total || 0;
        $('#chart-total-count').text(total);

        var colors = getVerdictColors();
        var isDark = isDarkTheme();
        var borderColor = isDark ? '#1e293b' : '#ffffff';

        var categories = stats.categories || [];
        var activeCategories = categories.filter(function(c) { return c.count > 0; });

        var dataVals = activeCategories.length > 0 ? activeCategories.map(function(c) { return c.count; }) : [1];
        var bgColors = activeCategories.length > 0 ? activeCategories.map(function(c) { return colors[c.code] || '#94a3b8'; }) : [isDark ? '#334155' : '#e2e8f0'];
        var labels = activeCategories.length > 0 ? activeCategories.map(function(c) { return c.name; }) : [total === 0 ? '{{ _("No submissions yet") }}' : ''];

        var ctx = canvas.getContext('2d');
        if (window.liveDonutChart) {
            window.liveDonutChart.destroy();
        }

        window.liveDonutChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: dataVals,
                    backgroundColor: bgColors,
                    borderColor: borderColor,
                    borderWidth: 2
                }],
                labels: labels
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                animation: false,
                cutoutPercentage: 72,
                legend: {
                    display: false
                },
                tooltips: {
                    enabled: activeCategories.length > 0,
                    backgroundColor: isDark ? 'rgba(15, 23, 42, 0.96)' : 'rgba(255, 255, 255, 0.96)',
                    titleFontColor: isDark ? '#f8fafc' : '#0f172a',
                    bodyFontColor: isDark ? '#cbd5e1' : '#334155',
                    borderColor: isDark ? '#334155' : '#cbd5e1',
                    borderWidth: 1,
                    callbacks: {
                        label: function(tooltipItem, data) {
                            var cat = activeCategories[tooltipItem.index];
                            if (!cat) return '';
                            var pct = total > 0 ? Math.round((cat.count / total) * 100) : 0;
                            return ' ' + cat.name + ' (' + cat.code + '): ' + cat.count + ' (' + pct + '%)';
                        }
                    }
                }
            }
        });

        // Render compact verdict legend
        var $legend = $('#live-verdict-legend');
        $legend.empty();
        categories.forEach(function(cat) {
            var catColor = colors[cat.code] || '#94a3b8';
            var $item = $('<div class="verdict-legend-item"></div>')
                .append($('<span class="verdict-dot"></span>').css('background-color', catColor))
                .append($('<span class="verdict-code"></span>').text(cat.code))
                .append($('<span class="verdict-count"></span>').text(cat.count));
            $legend.append($item);
        });
    }

    /* ========================================================
       Pane Resizer (accounts for workspace container)
       ======================================================== */
    function initResizer() {
        var $resizer = $('#live-pane-resizer');
        var $left = $('#live-pane-left');
        var $panes = $('#live-workspace-panes');
        if (!$resizer.length || !$panes.length) return;

        var savedPct = localStorage.getItem('live_ide_split_' + problemCode) || localStorage.getItem('live_ide_split_pct');
        if (savedPct) {
            var val = parseFloat(savedPct);
            if (!isNaN(val) && val >= 20 && val <= 80) {
                $left.css('flex', '0 0 ' + val + '%');
            }
        }

        var isDragging = false;
        $resizer.on('mousedown', function(e) {
            e.preventDefault();
            isDragging = true;
            $('body').css({ cursor: 'col-resize', userSelect: 'none' });
        });

        $(document).on('mousemove', function(e) {
            if (!isDragging) return;
            var panesWidth = $panes.width();
            if (panesWidth <= 0) return;

            var pointerOffset = e.pageX - $panes.offset().left;
            var pct = Math.max(20, Math.min(80, (pointerOffset / panesWidth) * 100));
            $left.css('flex', '0 0 ' + pct + '%');
            resizeAceEditor();
        });

        $(document).on('mouseup', function() {
            if (isDragging) {
                isDragging = false;
                $('body').css({ cursor: '', userSelect: '' });
                var panesWidth = $panes.width();
                if (panesWidth > 0) {
                    var curPct = ($left.width() / panesWidth) * 100;
                    localStorage.setItem('live_ide_split_' + problemCode, curPct.toFixed(1));
                }
            }
        });

        $resizer.on('keydown', function(e) {
            var panesWidth = $panes.width();
            var curPct = panesWidth > 0 ? ($left.width() / panesWidth) * 100 : 42;
            if (e.key === 'ArrowLeft') {
                curPct = Math.max(20, curPct - 5);
                $left.css('flex', '0 0 ' + curPct + '%');
                resizeAceEditor();
                localStorage.setItem('live_ide_split_' + problemCode, curPct.toFixed(1));
            } else if (e.key === 'ArrowRight') {
                curPct = Math.min(80, curPct + 5);
                $left.css('flex', '0 0 ' + curPct + '%');
                resizeAceEditor();
                localStorage.setItem('live_ide_split_' + problemCode, curPct.toFixed(1));
            }
        });
    }

    /* ========================================================
       Drawer Resizer (Vertical resize for bottom testcase drawer)
       ======================================================== */
    function initDrawerResizer() {
        var $resizer = $('#live-drawer-resizer');
        var $drawer = $('#live-testcase-drawer');
        var $paneRight = $('#live-pane-right');
        var $editorContainer = $('#live-editor-container');
        var $drawerContent = $('#drawer-content-area');
        if (!$resizer.length || !$drawer.length || !$paneRight.length) return;

        // Restore saved drawer height if available
        var savedH = localStorage.getItem('live_ide_drawer_height_' + problemCode) || localStorage.getItem('live_ide_drawer_height');
        if (savedH) {
            var val = parseInt(savedH, 10);
            if (!isNaN(val) && val >= 70 && val <= 1500) {
                $drawer.css('height', val + 'px');
            }
        }

        var isDragging = false;
        var startY = 0;
        var startHeight = 0;

        function onDragStart(clientY) {
            isDragging = true;
            startY = clientY;
            startHeight = $drawer.outerHeight();
            $drawer.addClass('is-resizing');
            $resizer.addClass('dragging');
            $editorContainer.css('pointer-events', 'none');
            $drawerContent.css('pointer-events', 'none');
            $('body').css({ cursor: 'row-resize', userSelect: 'none' });
        }

        function onDragMove(clientY) {
            if (!isDragging) return;
            var deltaY = startY - clientY; // Dragging UP increases drawer height
            var paneHeight = $paneRight.height();
            var minH = 42; // Collapsed header height
            var maxH = Math.max(120, paneHeight - 80); // Keep at least 80px for code editor
            var newHeight = Math.round(Math.max(minH, Math.min(maxH, startHeight + deltaY)));

            if (newHeight > 55 && state.isDrawerCollapsed) {
                state.isDrawerCollapsed = false;
                $drawer.removeClass('collapsed');
                $('#btn-toggle-drawer i').removeClass('fa-chevron-up').addClass('fa-chevron-down');
            } else if (newHeight <= 55 && !state.isDrawerCollapsed) {
                state.isDrawerCollapsed = true;
                $drawer.addClass('collapsed');
                $('#btn-toggle-drawer i').removeClass('fa-chevron-down').addClass('fa-chevron-up');
            }

            $drawer.css('height', newHeight + 'px');
            resizeAceEditor();
        }

        function onDragEnd() {
            if (!isDragging) return;
            isDragging = false;
            $drawer.removeClass('is-resizing');
            $resizer.removeClass('dragging');
            $editorContainer.css('pointer-events', '');
            $drawerContent.css('pointer-events', '');
            $('body').css({ cursor: '', userSelect: '' });

            var finalHeight = $drawer.outerHeight();
            if (finalHeight > 55) {
                localStorage.setItem('live_ide_drawer_height_' + problemCode, finalHeight);
                localStorage.setItem('live_ide_drawer_height', finalHeight);
            }
            resizeAceEditor();
        }

        $resizer.on('mousedown', function(e) {
            e.preventDefault();
            onDragStart(e.pageY);
        });

        $resizer.on('touchstart', function(e) {
            if (e.originalEvent.touches && e.originalEvent.touches.length === 1) {
                onDragStart(e.originalEvent.touches[0].pageY);
            }
        });

        $(document).on('mousemove', function(e) {
            if (isDragging) {
                onDragMove(e.pageY);
            }
        });

        $(document).on('touchmove', function(e) {
            if (isDragging && e.originalEvent.touches && e.originalEvent.touches.length === 1) {
                onDragMove(e.originalEvent.touches[0].pageY);
            }
        });

        $(document).on('mouseup', function() {
            if (isDragging) {
                onDragEnd();
            }
        });

        $(document).on('touchend touchcancel', function() {
            if (isDragging) {
                onDragEnd();
            }
        });

        $resizer.on('dblclick', function() {
            toggleDrawer();
        });

        $resizer.on('keydown', function(e) {
            var curHeight = $drawer.outerHeight();
            var paneHeight = $paneRight.height();
            var maxH = Math.max(120, paneHeight - 80);
            var step = e.shiftKey ? 50 : 20;

            if (e.key === 'ArrowUp') {
                e.preventDefault();
                var newH = Math.min(maxH, curHeight + step);
                if (state.isDrawerCollapsed) {
                    state.isDrawerCollapsed = false;
                    $drawer.removeClass('collapsed');
                    $('#btn-toggle-drawer i').removeClass('fa-chevron-up').addClass('fa-chevron-down');
                }
                $drawer.css('height', newH + 'px');
                resizeAceEditor();
                localStorage.setItem('live_ide_drawer_height_' + problemCode, newH);
                localStorage.setItem('live_ide_drawer_height', newH);
            } else if (e.key === 'ArrowDown') {
                e.preventDefault();
                var newH = Math.max(70, curHeight - step);
                $drawer.css('height', newH + 'px');
                resizeAceEditor();
                localStorage.setItem('live_ide_drawer_height_' + problemCode, newH);
                localStorage.setItem('live_ide_drawer_height', newH);
            }
        });
    }

    /* ========================================================
       Testcase Tabs & Runner
       ======================================================== */
    function renderTabs() {
        var $tabs = $('#testcase-tabs-list');
        $tabs.empty();

        state.testcases.forEach(function(tc, idx) {
            var dotColor = tc.status === 'AC' ? '#16a34a' : (tc.status === 'CE' ? '#d97706' : (tc.status === 'WA' || tc.status === 'TLE' || tc.status === 'RTE' ? '#dc2626' : '#0284c7'));
            var dotHtml = tc.status ? '<span class="tc-tab-status-dot" style="background:' + dotColor + '"></span> ' : '';
            var isTabActive = (state.activeTab === idx);
            var $btn = $('<button type="button" class="tc-tab-btn" role="tab"></button>')
                .attr('id', 'tc-tab-' + idx)
                .attr('aria-selected', isTabActive ? 'true' : 'false')
                .toggleClass('active', isTabActive)
                .html(dotHtml + '<span class="tc-tab-label">Test ' + (idx + 1) + '</span>');

            $btn.on('click', function() {
                selectTab(idx);
            });
            $tabs.append($btn);
        });

        $('#btn-add-testcase').prop('disabled', state.testcases.length >= 5);

        var isConsoleActive = (state.activeTab === 'console');
        $('#btn-tab-console')
            .toggleClass('active', isConsoleActive)
            .attr('aria-selected', isConsoleActive ? 'true' : 'false');

        if (isConsoleActive) {
            $('#testcase-panels').addClass('hidden');
            $('#console-panel').removeClass('hidden');
        } else {
            $('#console-panel').addClass('hidden');
            $('#testcase-panels').removeClass('hidden');
            renderPanel();
        }
    }

    function renderPanel() {
        var $panels = $('#testcase-panels');
        $panels.empty();
        var tc = state.testcases[state.activeTab];
        if (!tc) return;

        var statusBadgeHtml = '';
        if (tc.status) {
            var badgeClass = 'badge-verdict-' + tc.status.toLowerCase();
            var iconClass = tc.status === 'AC' ? 'fa-check' : (tc.status === 'WA' ? 'fa-times' : (tc.status === 'TLE' ? 'fa-clock-o' : 'fa-exclamation-triangle'));
            statusBadgeHtml = '<span class="badge-verdict ' + badgeClass + '"><i class="fa ' + iconClass + '"></i> ' + tc.status + '</span>';
        }

        var metaHtml = '';
        if (tc.time || tc.memory) {
            metaHtml = '<span class="tc-meta-info">' + (tc.time ? tc.time + 's' : '') + (tc.memory ? ' | ' + (tc.memory / 1024).toFixed(1) + 'MB' : '') + '</span>';
        }

        var deleteBtnHtml = state.testcases.length > 1 ? '<button type="button" class="btn btn-xs btn-outline-danger btn-del-tc" style="font-size: 0.72rem; padding: 1px 6px;"><i class="fa fa-trash"></i> {{ _("Delete test") }}</button>' : '';

        var html = [
            '<div class="tc-panel-content" role="tabpanel" aria-labelledby="tc-tab-' + state.activeTab + '">',
            '  <div class="tc-field-group">',
            '    <label><span>{{ _("Input") }}</span> ' + deleteBtnHtml + '</label>',
            '    <textarea class="tc-textarea" id="tc-input" placeholder="{{ _("Enter testcase input here...") }}">' + escapeHtml(tc.input) + '</textarea>',
            '    <label style="margin-top: 6px;">{{ _("Expected Output (Optional)") }}</label>',
            '    <textarea class="tc-textarea" id="tc-expected" placeholder="{{ _("Enter expected output to compare AC/WA...") }}">' + escapeHtml(tc.expected || '') + '</textarea>',
            '  </div>',
            '  <div class="tc-field-group">',
            '    <label><span>{{ _("Actual Output") }}</span> <div>' + statusBadgeHtml + ' ' + metaHtml + '</div></label>',
            '    <textarea class="tc-textarea" id="tc-actual" readonly style="height: 160px;" placeholder="{{ _("Execution output will appear here...") }}">' + escapeHtml(tc.actual || tc.feedback || '') + '</textarea>',
            '  </div>',
            '</div>'
        ].join('');

        $panels.html(html);

        $('#tc-input').on('input', function() {
            tc.input = $(this).val();
            scheduleSaveDraft();
        });
        $('#tc-expected').on('input', function() {
            tc.expected = $(this).val();
            scheduleSaveDraft();
        });
        $('.btn-del-tc').on('click', function() {
            deleteTestcase(state.activeTab);
        });
    }

    function selectTab(idx) {
        if (idx === 'console') {
            state.activeTab = 'console';
            renderTabs();
            var scrollEl = document.getElementById('console-log-scroll');
            if (scrollEl) {
                scrollEl.scrollTop = scrollEl.scrollHeight;
            }
            return;
        }
        if (typeof idx === 'number' && idx >= 0 && idx < state.testcases.length) {
            state.activeTab = idx;
            renderTabs();
        }
    }

    function addTestcase() {
        if (state.testcases.length >= 5) return;
        var newId = state.testcases.length + 1;
        state.testcases.push({
            id: newId,
            input: '',
            expected: '',
            actual: '',
            status: '',
            time: 0,
            memory: 0
        });
        state.activeTab = state.testcases.length - 1;
        renderTabs();
        scheduleSaveDraft();
    }

    function deleteTestcase(idx) {
        if (state.testcases.length <= 1) return;
        state.testcases.splice(idx, 1);
        if (state.activeTab !== 'console') {
            if (state.activeTab >= state.testcases.length) {
                state.activeTab = state.testcases.length - 1;
            }
        }
        renderTabs();
        scheduleSaveDraft();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

    /* Console Helpers */
    function getTimestamp() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        var s = String(now.getSeconds()).padStart(2, '0');
        return '[' + h + ':' + m + ':' + s + ']';
    }

    function stripAnsi(str) {
        if (!str) return '';
        return String(str)
            .replace(/\x1b\[[0-9;]*[a-zA-Z]/g, '')
            .replace(/\[[0-9;]*m/g, '')
            .replace(/\[\d+;\d+m/g, '')
            .replace(/\[K/g, '');
    }

    function setConsoleBadge(text, type) {
        var $badge = $('#console-badge');
        $badge.removeClass('ready running success error ce').addClass(type).text(text);
    }

    function setConsoleStatusDot(type) {
        var $dot = $('#console-status-dot');
        if (!type) {
            $dot.addClass('hidden').removeClass('running success warning error ce');
        } else {
            $dot.removeClass('hidden running success warning error ce').addClass(type);
        }
    }

    function appendConsoleLog(line) {
        var $log = $('#console-log-content');
        var currentText = $log.text();
        var newText = currentText ? (currentText + '\n' + line) : line;
        $log.text(newText);
        var scrollEl = document.getElementById('console-log-scroll');
        if (scrollEl) {
            scrollEl.scrollTop = scrollEl.scrollHeight;
        }
    }

    function clearConsoleLog() {
        $('#console-log-content').text('');
        setConsoleBadge('{{ _("Ready") }}', 'ready');
        setConsoleStatusDot(null);
    }

    function copyConsoleLog() {
        var text = $('#console-log-content').text();
        if (!text) return;
        var onCopied = function() {
            var $btn = $('#btn-copy-console');
            var originalHtml = $btn.html();
            $btn.html('<i class="fa fa-check text-success"></i> <span>{{ _("Copied!") }}</span>');
            setTimeout(function() {
                $btn.html(originalHtml);
            }, 1500);
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(onCopied).catch(function() {
                fallbackCopy(text, onCopied);
            });
        } else {
            fallbackCopy(text, onCopied);
        }
    }

    function fallbackCopy(text, cb) {
        var $temp = $('<textarea>');
        $('body').append($temp);
        $temp.val(text).select();
        try {
            document.execCommand('copy');
            if (cb) cb();
        } catch (e) {}
        $temp.remove();
    }

    /* Run Custom Testcases via Live Runner */
    function runTests() {
        if (state.isRunning) return;
        var editor = getAceEditor();
        var source = editor ? editor.getValue() : $('#id_source').val();
        if (!source || !source.trim()) {
            alert('{{ _("Please enter source code before running.") }}');
            return;
        }

        var langId = $('#live-lang-select').val();
        var $selectedOpt = $('#live-lang-select option:selected');
        var langKey = $selectedOpt.data('key');
        var langName = $selectedOpt.text().trim();
        if (!langId && !langKey) {
            alert('{{ _("Please select a programming language.") }}');
            return;
        }

        state.isRunning = true;
        $('#btn-build-run').prop('disabled', true).html('<i class="fa fa-spinner fa-spin"></i> <span>{{ _("Running...") }}</span>');
        $('#live-compile-error').addClass('hidden');

        // Expand drawer if collapsed
        if (state.isDrawerCollapsed) {
            toggleDrawer();
        }

        var startTime = new Date();
        var ts = getTimestamp();
        setConsoleBadge('{{ _("Running...") }}', 'running');
        setConsoleStatusDot('running');

        appendConsoleLog('--------------------------------------------------');
        appendConsoleLog(ts + ' {{ _("Starting Build & Run") }} (' + (langName || langKey) + ')');
        appendConsoleLog(ts + ' {{ _("Testcases count:") }} ' + state.testcases.length);

        var payload = {
            language: langId,
            language_key: langKey,
            source: source,
            testcases: state.testcases.map(function(tc) {
                return {
                    id: tc.id,
                    input: tc.input || '',
                    expected: tc.expected || ''
                };
            })
        };

        $.ajax({
            url: liveRunUrl,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            headers: {
                'X-CSRFToken': getCsrfToken()
            },
            success: function(resp) {
                state.isRunning = false;
                $('#btn-build-run').prop('disabled', false).html('<i class="fa fa-play"></i> <span>{{ _("Build & Run") }}</span>');
                var tsDone = getTimestamp();
                var duration = ((new Date() - startTime) / 1000).toFixed(2);

                if (resp.status === 'CE') {
                    var cleanErr = stripAnsi(resp.compile_error || '{{ _("Compilation error occurred.") }}');
                    $('#live-compile-error').removeClass('hidden');
                    $('#live-compile-error-msg').text(cleanErr);

                    setConsoleBadge('{{ _("Compilation Error") }}', 'ce');
                    setConsoleStatusDot('ce');
                    appendConsoleLog(tsDone + ' [ERROR] {{ _("Compilation Error:") }}');
                    appendConsoleLog(cleanErr);
                    appendConsoleLog(tsDone + ' {{ _("Build failed in") }} ' + duration + 's');

                    state.testcases.forEach(function(tc) {
                        tc.status = 'CE';
                        tc.actual = '';
                    });

                    // Auto-switch to console tab so user immediately sees full compiler error
                    selectTab('console');
                } else if (resp.status === 'OK' && resp.results) {
                    $('#live-compile-error').addClass('hidden');
                    appendConsoleLog(tsDone + ' [OK] {{ _("Compilation succeeded.") }}');

                    var passed = 0;
                    var total = resp.results.length;

                    resp.results.forEach(function(res, idx) {
                        if (state.testcases[idx]) {
                            state.testcases[idx].status = res.status;
                            state.testcases[idx].actual = res.actual || '';
                            state.testcases[idx].feedback = res.feedback || '';
                            state.testcases[idx].time = res.time || 0;
                            state.testcases[idx].memory = res.memory || 0;
                        }

                        var timeStr = res.time !== undefined ? res.time + 's' : '';
                        var memStr = res.memory ? ((res.memory / 1024).toFixed(1) + 'MB') : '';
                        var meta = [timeStr, memStr].filter(Boolean).join(', ');
                        if (meta) meta = ' (' + meta + ')';

                        if (res.status === 'AC') {
                            passed++;
                            appendConsoleLog(tsDone + ' Test #' + (idx + 1) + ': AC - {{ _("Accepted") }}' + meta);
                        } else if (res.status === 'WA') {
                            appendConsoleLog(tsDone + ' Test #' + (idx + 1) + ': WA - {{ _("Wrong Answer") }}' + meta);
                            if (res.feedback) {
                                appendConsoleLog('    ' + stripAnsi(res.feedback));
                            }
                        } else if (res.status === 'TLE') {
                            appendConsoleLog(tsDone + ' Test #' + (idx + 1) + ': TLE - {{ _("Time Limit Exceeded") }}' + meta);
                        } else if (res.status === 'RTE') {
                            appendConsoleLog(tsDone + ' Test #' + (idx + 1) + ': RTE - {{ _("Runtime Error") }}' + meta);
                            if (res.feedback) {
                                appendConsoleLog('    ' + stripAnsi(res.feedback));
                            }
                        } else {
                            appendConsoleLog(tsDone + ' Test #' + (idx + 1) + ': ' + (res.status || 'DONE') + meta);
                        }
                    });

                    var allPassed = (passed === total && total > 0);
                    if (allPassed) {
                        setConsoleBadge('{{ _("Passed") }} (' + passed + '/' + total + ')', 'success');
                        setConsoleStatusDot('success');
                    } else {
                        setConsoleBadge('{{ _("Failed") }} (' + passed + '/' + total + ')', 'error');
                        setConsoleStatusDot('error');
                    }
                    appendConsoleLog(tsDone + ' {{ _("Done in") }} ' + duration + 's. {{ _("Passed:") }} ' + passed + '/' + total);
                    renderTabs();
                } else if (resp.error) {
                    var errText = stripAnsi(resp.error);
                    setConsoleBadge('{{ _("Error") }}', 'error');
                    setConsoleStatusDot('error');
                    appendConsoleLog(tsDone + ' [ERROR] ' + errText);
                    alert('{{ _("Error:") }} ' + errText);
                    renderTabs();
                }
            },
            error: function(xhr) {
                state.isRunning = false;
                $('#btn-build-run').prop('disabled', false).html('<i class="fa fa-play"></i> <span>{{ _("Build & Run") }}</span>');
                var tsErr = getTimestamp();
                var err = xhr.responseJSON && xhr.responseJSON.error ? xhr.responseJSON.error : '{{ _("Error sending execution request.") }}';
                var cleanErr = stripAnsi(err);
                setConsoleBadge('{{ _("Error") }}', 'error');
                setConsoleStatusDot('error');
                appendConsoleLog(tsErr + ' [SERVER ERROR] ' + cleanErr);
                alert(cleanErr);
                renderTabs();
            }
        });
    }

    /* Submit Solution directly */
    function submitSolution() {
        var editor = getAceEditor();
        if (editor) {
            var val = editor.getValue();
            $('#id_source').val(val);
        }
        var selectedId = $('#live-lang-select').val();
        $('#id_language').val(selectedId);
        $('#problem_submit').trigger('submit');
    }

    /* Draft Autosave */
    function scheduleSaveDraft() {
        var $status = $('#live-draft-status');
        $status.addClass('saving').html('<i class="fa fa-spinner fa-spin"></i> {{ _("Saving...") }}');
        if (state.saveTimeout) {
            clearTimeout(state.saveTimeout);
        }
        state.saveTimeout = setTimeout(saveDraftImmediate, 1500);
    }

    function saveDraftImmediate() {
        if (state.saveTimeout) {
            clearTimeout(state.saveTimeout);
            state.saveTimeout = null;
        }

        var editor = getAceEditor();
        var source = editor ? editor.getValue() : $('#id_source').val();
        var langId = $('#live-lang-select').val();
        var langKey = $('#live-lang-select option:selected').data('key');

        var payload = {
            language: langId,
            language_key: langKey,
            source: source,
            testcases: state.testcases.map(function(tc) {
                return {
                    id: tc.id,
                    input: tc.input || '',
                    expected: tc.expected || ''
                };
            })
        };

        $.ajax({
            url: draftUrl,
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify(payload),
            headers: {
                'X-CSRFToken': getCsrfToken()
            },
            success: function() {
                $('#live-draft-status').removeClass('saving').html('<i class="fa fa-check-circle"></i> {{ _("Draft saved") }}');
            },
            error: function() {
                $('#live-draft-status').removeClass('saving').html('<i class="fa fa-exclamation-circle text-danger"></i> {{ _("Failed to save draft") }}');
            }
        });
    }

    function loadDraft() {
        $.ajax({
            url: draftUrl,
            method: 'GET',
            success: function(resp) {
                if (resp && (resp.has_draft || resp.source || (resp.testcases && resp.testcases.length > 0))) {
                    if (resp.source) {
                        var editor = getAceEditor();
                        if (editor) {
                            var currentVal = editor.getValue();
                            if (!currentVal || !currentVal.trim()) {
                                editor.setValue(resp.source, 1);
                                resizeAceEditor();
                            }
                        } else {
                            if (!$('#id_source').val()) {
                                $('#id_source').val(resp.source);
                            }
                        }
                    }
                    if (resp.language) {
                        if ($('#live-lang-select').val() != resp.language) {
                            $('#live-lang-select').val(resp.language).trigger('change');
                        }
                    }
                    if (resp.testcases && resp.testcases.length > 0) {
                        state.testcases = resp.testcases.map(function(tc, idx) {
                            return {
                                id: tc.id || (idx + 1),
                                input: tc.input || '',
                                expected: tc.expected || '',
                                actual: '',
                                status: '',
                                time: 0,
                                memory: 0
                            };
                        });
                        if (state.activeTab !== 'console' && state.activeTab >= state.testcases.length) {
                            state.activeTab = 0;
                        }
                        renderTabs();
                    }
                }
            }
        });
    }

    function toggleDrawer() {
        var $drawer = $('#live-testcase-drawer');
        state.isDrawerCollapsed = !state.isDrawerCollapsed;
        $drawer.toggleClass('collapsed', state.isDrawerCollapsed);
        if (!state.isDrawerCollapsed) {
            var curH = parseInt($drawer.css('height'), 10);
            if (isNaN(curH) || curH <= 55) {
                var savedH = localStorage.getItem('live_ide_drawer_height_' + problemCode) || localStorage.getItem('live_ide_drawer_height');
                var restoreH = parseInt(savedH, 10);
                if (isNaN(restoreH) || restoreH <= 55) restoreH = 240;
                $drawer.css('height', restoreH + 'px');
            }
        }
        var $icon = $('#btn-toggle-drawer i');
        $icon.toggleClass('fa-chevron-up', state.isDrawerCollapsed).toggleClass('fa-chevron-down', !state.isDrawerCollapsed);
        setTimeout(resizeAceEditor, 210);
    }

    /* Initialize everything on page load */
    $(function() {
        $('body').addClass('body-live-ide-wide');
        $('#content').addClass('content-live-ide-wide');

        initSidebar();
        initSubmissionsModal();
        initCommentsModal();
        initDonutChart();
        initResizer();
        initDrawerResizer();
        renderTabs();
        initThemeWatchers();

        $(window).on('resize', function() {
            resizeAceEditor();
            if (window.liveDonutChart) {
                window.liveDonutChart.resize();
            }
        });

        $('#btn-add-testcase').on('click', addTestcase);
        $('#btn-tab-console').on('click', function() {
            selectTab('console');
        });
        $('#btn-clear-console').on('click', clearConsoleLog);
        $('#btn-copy-console').on('click', copyConsoleLog);
        $('#btn-toggle-drawer').on('click', toggleDrawer);
        $('#btn-build-run').on('click', runTests);
        $('#btn-live-submit').on('click', submitSolution);

        $('#live-lang-select').on('change', function() {
            var selectedAce = $(this).find('option:selected').data('ace');
            var selectedId = $(this).val();
            $('#id_language').val(selectedId).trigger('change');
            var editor = getAceEditor();
            if (editor && selectedAce) {
                editor.getSession().setMode('ace/mode/' + selectedAce);
            }
            scheduleSaveDraft();
        });

        // Keyboard shortcuts
        $(document).on('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                runTests();
            } else if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                saveDraftImmediate();
            }
        });

        function setupAceEditor(editor) {
            if (!editor || editor._live_ide_initialized) return;
            editor._live_ide_initialized = true;

            applyTheme();

            if (window.initial_draft && window.initial_draft.source) {
                var currentVal = editor.getValue();
                if (!currentVal || !currentVal.trim()) {
                    editor.setValue(window.initial_draft.source, 1);
                }
            }

            editor.getSession().on('change', function() {
                scheduleSaveDraft();
            });
            loadDraft();
            resizeAceEditor();
        }

        // 1. Listen for Django Ace's custom event
        $('#ace_source').on('ace_load', function(e, editor) {
            setupAceEditor(editor);
        });

        // 2. Poll fallback for getAceEditor()
        var checkAceInterval = setInterval(function() {
            var editor = getAceEditor();
            if (editor) {
                clearInterval(checkAceInterval);
                setupAceEditor(editor);
            }
        }, 100);
        setTimeout(function() { clearInterval(checkAceInterval); }, 8000);
    });
})(jQuery);
</script>
