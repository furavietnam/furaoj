<style>
/* Live IDE Split View & Responsive Layout */
#live-ide-container {
    display: flex;
    flex-direction: row;
    height: calc(100vh - 110px);
    min-height: 650px;
    width: 100%;
    border-radius: 6px;
    overflow: hidden;
    background: #fff;
    border: 1px solid #dcdcdc;
    margin: 8px 0 20px 0;
    box-sizing: border-box;
}

.live-pane {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    height: 100%;
}

#live-pane-left {
    flex: 0 0 50%;
    min-width: 320px;
    max-width: 80%;
    border-right: 1px solid #e0e0e0;
    background: #fafafa;
}

#live-pane-right {
    flex: 1 1 0;
    min-width: 340px;
    background: #fff;
}

/* Resizer Handle */
#live-pane-resizer {
    width: 8px;
    background: #e8e8e8;
    cursor: col-resize;
    user-select: none;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
    z-index: 5;
}
#live-pane-resizer:hover, #live-pane-resizer:focus {
    background: #2563eb;
    outline: none;
}
.resizer-handle {
    width: 2px;
    height: 32px;
    background: #aaa;
    border-radius: 1px;
}
#live-pane-resizer:hover .resizer-handle {
    background: #fff;
}

/* Left Pane: Info Card & Problem Statement */
.problem-info-card {
    padding: 12px 16px;
    background: #f1f5f9;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
}

.problem-meta-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.meta-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    font-size: 0.85rem;
    color: #334155;
    font-weight: 500;
}

.problem-statement-scroll {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 20px 24px;
    background: #fff;
}

.problem-title-header h2 {
    margin-top: 0;
    margin-bottom: 16px;
    font-size: 1.5rem;
    color: #0f172a;
}

.problem-clarify-row {
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid #e2e8f0;
}

/* Right Pane: Live IDE Toolbar */
.live-ide-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
    gap: 12px;
    flex-wrap: wrap;
}

.toolbar-left, .toolbar-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

.live-lang-select {
    padding: 6px 12px;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    font-size: 0.9rem;
    background: #fff;
    color: #0f172a;
    font-weight: 500;
    cursor: pointer;
}

.draft-status-indicator {
    font-size: 0.82rem;
    color: #64748b;
    display: inline-flex;
    align-items: center;
    gap: 4px;
}
.draft-status-indicator.saving {
    color: #eab308;
}

.btn-live-action {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 0.9rem;
    font-weight: 600;
    border: none;
    cursor: pointer;
    transition: all 0.15s ease-in-out;
}

.btn-build-run {
    background: #0284c7;
    color: #fff;
}
.btn-build-run:hover:not(:disabled) {
    background: #0369a1;
}

.btn-live-submit {
    background: #16a34a;
    color: #fff;
}
.btn-live-submit:hover:not(:disabled) {
    background: #15803d;
}

.btn-live-action:disabled {
    opacity: 0.65;
    cursor: not-allowed;
}

/* Ace Editor Container */
.live-editor-container {
    flex: 1 1 auto;
    position: relative;
    overflow: hidden;
    min-height: 250px;
}

.live-editor-container #problem_submit {
    height: 100%;
    display: flex;
    flex-direction: column;
}

.live-editor-container #submit-wrapper {
    height: 100%;
    display: flex;
    flex-direction: column;
}

.live-editor-container #editor {
    height: 100% !important;
    display: flex !important;
    flex-direction: column;
}

.live-editor-container #editor > div:first-child,
.live-editor-container hr,
.live-editor-container #language,
.live-editor-container .submit-bar {
    display: none !important;
}

.live-editor-container .django-ace-widget {
    flex: 1 1 auto !important;
    height: 100% !important;
    width: 100% !important;
}

.live-editor-container #ace_source {
    height: 100% !important;
    width: 100% !important;
    font-size: 14px;
}

/* CP Editor style Testcase Drawer */
.testcase-drawer {
    flex: 0 0 240px;
    display: flex;
    flex-direction: column;
    border-top: 1px solid #cbd5e1;
    background: #f8fafc;
    transition: flex-basis 0.2s ease;
    overflow: hidden;
}

.testcase-drawer.collapsed {
    flex: 0 0 38px !important;
}

.drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #f1f5f9;
    border-bottom: 1px solid #e2e8f0;
    padding: 0 12px;
    height: 38px;
    flex-shrink: 0;
}

.testcase-tabs-bar {
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
}

.tabs-list {
    display: flex;
    align-items: center;
    gap: 2px;
}

.tc-tab-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    font-size: 0.82rem;
    font-weight: 600;
    color: #475569;
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
}

.tc-tab-btn:hover {
    color: #0f172a;
    background: #e2e8f0;
}

.tc-tab-btn.active {
    color: #0284c7;
    border-bottom-color: #0284c7;
    background: #fff;
}

.tc-tab-status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
}

.tab-btn-add {
    padding: 4px 8px;
    border: 1px dashed #94a3b8;
    background: #fff;
    border-radius: 4px;
    color: #475569;
    cursor: pointer;
    font-size: 0.8rem;
    margin-left: 4px;
}
.tab-btn-add:hover {
    border-color: #0284c7;
    color: #0284c7;
}

.drawer-header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.btn-drawer-toggle {
    background: transparent;
    border: none;
    color: #64748b;
    cursor: pointer;
    padding: 4px 8px;
}

.drawer-body {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

/* Testcase Panel Inputs / Outputs */
.tc-panel-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    height: 100%;
}

.tc-field-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.tc-field-group label {
    font-size: 0.78rem;
    font-weight: 700;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.tc-textarea {
    width: 100%;
    height: 70px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 0.85rem;
    padding: 6px 8px;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    background: #fff;
    resize: vertical;
    box-sizing: border-box;
}

.tc-textarea:focus {
    border-color: #0284c7;
    outline: none;
}

.tc-textarea[readonly] {
    background: #f8fafc;
    color: #0f172a;
}

/* Verdict Badges (Color + Icon + Text) */
.badge-verdict {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    text-transform: uppercase;
}

.badge-verdict-ac { background: #16a34a; }
.badge-verdict-wa { background: #dc2626; }
.badge-verdict-tle { background: #ea580c; }
.badge-verdict-mle { background: #7c3aed; }
.badge-verdict-rte { background: #991b1b; }
.badge-verdict-ce { background: #d97706; }
.badge-verdict-executed { background: #0284c7; }

.tc-meta-info {
    font-size: 0.78rem;
    color: #64748b;
    display: inline-flex;
    gap: 8px;
    align-items: center;
}

/* Compilation Error Box */
.compile-error-panel {
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 4px;
    padding: 8px 12px;
    color: #991b1b;
}

.compile-error-panel .error-title {
    font-size: 0.85rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
}

.compile-error-panel pre {
    margin: 0;
    white-space: pre-wrap;
    font-size: 0.8rem;
    max-height: 120px;
    overflow-y: auto;
    font-family: monospace;
}

/* Responsive Breakpoints */
@media (max-width: 1024px) {
    #live-ide-container {
        flex-direction: column;
        height: auto;
    }
    #live-pane-left, #live-pane-right {
        flex: 1 1 auto;
        max-width: 100%;
        min-width: 100%;
        border-right: none;
    }
    #live-pane-resizer {
        display: none;
    }
    .live-editor-container {
        min-height: 400px;
    }
}

@media (max-width: 768px) {
    .tc-panel-content {
        grid-template-columns: 1fr;
    }
    .live-ide-toolbar {
        flex-direction: column;
        align-items: stretch;
    }
    .toolbar-left, .toolbar-right {
        justify-content: space-between;
    }
}
</style>
